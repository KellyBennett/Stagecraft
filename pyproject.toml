[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stagecraft-cli"
version = "0.1.0"
description = "A photograph, a human camera match, and a primitive Blender stage."
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13"]

[project.scripts]
stagecraft = "stagecraft.cli:main"

[tool.setuptools.package-data]
stagecraft = ["web/*.html"]
